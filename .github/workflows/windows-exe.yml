name: Build offline Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test Go launcher
        run: go test ./...
      - name: Test game logic
        run: node --test tests/*.test.cjs
      - name: Build Windows GUI executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-s -w -H windowsgui" -o 'dist/打字小站.exe' .
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: WordGame-Windows-EXE
          path: dist/打字小站.exe
          retention-days: 30
