name: Build and publish Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test Go launcher
        run: go test ./...
      - name: Test game logic
        run: node --test tests/*.test.cjs
      - name: Build Windows GUI executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-s -w -H windowsgui" -o 'dist/WordGame.exe' .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordGame-Windows-EXE
          path: dist/WordGame.exe
          retention-days: 30
      - name: Publish permanent GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.$env:GITHUB_RUN_NUMBER.0"
          gh release create $tag 'dist/WordGame.exe#WordGame.exe' --title "打字小站 Windows 离线版 $tag" --notes "Windows 10/11 64 位；下载 WordGame.exe 后双击即可运行。游戏离线使用，需电脑已有 Edge 或 Chrome。" --latest --target $env:GITHUB_SHA
